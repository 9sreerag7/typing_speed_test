<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Typing Speed Test</h1>
        <div id="text-passage" class="text-passage"></div>
        <textarea id="user-input" class="user-input" placeholder="Start typing above text..."></textarea>
        <div class="metrics">
            <div id="timer" class="timer">Time: 0s</div>
            <div id="wpm" class="wpm">WPM: 0</div>
            <div id="accuracy" class="accuracy">Accuracy: 100%</div>
        </div>
        <button id="restart-button" class="restart-button">Restart</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
